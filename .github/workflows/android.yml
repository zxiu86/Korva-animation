name: Korva Animation Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release APK (AGP 9.1.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Cache Gradle & Android Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore" 2>/dev/null || true
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Korva-Animation-v1.3.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korva-Animation-v1.3-APK
          path: release-assets/Korva-Animation-v1.3.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish GitHub Release (Direct APK)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Korva-Animation-v1.3.apk
          name: "Korva Animation Studio v1.3"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Korva Animation Studio v1.3 🎬
            
            ### 📥 Direct APK Download:
            Download **Korva-Animation-v1.3.apk** directly below and install on Android (no zip extraction needed!).

            ### ✨ What's New in v1.3:
            - **Mutually Exclusive Tools**: Move, Rotate, Scale, and Background Pan operate in strict isolation.
            - **Circular Rotation Dial 🔵**: Free, ultra-smooth 360° polar angle rotation without pixel step constraints.
            - **Enhanced Gizmos**: Specialized visual gizmo feedback per active tool.
            - **Timeline & UI Enhancements**: RTL/LTR layout stability and performance optimizations.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
